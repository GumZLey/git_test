<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <!-- Fonts -->
     <title>Tic-Tac-Toe</title>
</head>
<body>
    <header>
        <h1>GumZLey</h1>
    </header>

    <main>
        <div class="game-frame">
            <div id="display-board" class="display-board">
                <div class="box 0" id="box"></div>
                <div class="box 1" id="box"></div>
                <div class="box 2" id="box"></div>
                <div class="box 3" id="box"></div>
                <div class="box 4" id="box"></div>
                <div class="box 5" id="box"></div>
                <div class="box 6" id="box"></div>
                <div class="box 7" id="box"></div>
                <div class="box 8" id="box"></div>
            </div>
        </div>

        <dialog>
            <h2>Player1 win</h2>
        </dialog>
    </main>

    <footer>
        <div class="player-score">
            <h2>(X) Player1: <span id="player1-score">0</span></h2>
            <h2>(O) Player2: <span id="player2-score">0</span></h2>
        </div>
        <button type="button" id="reset-stat">Reset</button>
        <div class="contact">
            <ul>
                <li><a href="#">Github</a></li>
                <li><a href="#">LinkedIn</a></li>
                <li><a href="#">Instragram</a></li>
                <li><a href="#">Email</a></li>
            </ul>
        </div>
    </footer>
</body>
</html>
