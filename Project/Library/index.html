<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"> -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Signika+Negative:wght@300..700&display=swap" rel="stylesheet">
    <!-- Font -->
</head>
<body>
    <header>
        <h1>GumZLey's Library</h1>
    </header>

    <div id="overlay"></div>

    <div class="pop-ups" id="pop-ups">
        <div class="card">
            <div class="pop-ups-header">
                <h2>What's your new book</h2>
                <button data-close-button id="pop-ups-exit">&times;</button>
            </div>
            <hr>
            <form action="" method="post">
                <div class="title-input-form">
                    <label for="title-input">Title</label>
                    <input type="text" id="title-input" name="title-input">
                </div>

                <div class="description-input-form">
                    <label for="title-input">Description</label>
                    <textarea type="text" id="description-input" name="description-input"></textarea>
                </div>
                
                <button type="submit" id="submit">Add</button>
            </form>
        </div>
    </div>

    <main id="main">
        <div class="card-container adder-container">
            <div class="card adder">
                <h2 class="book-title" id="title">Add</h2>
                <button class="add-card" data-modal-target="#pop-ups">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1.5rem" height="1.5rem" fill="currentColor" class="bi bi-plus-circle" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                        <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                      </svg>
                    </button>
                <p class="book-description" id="description">Your book is not listed? Click the add sign above.</p>
            </div>
        </div>
    </main>
    <footer>
        <a href="https://www.instagram.com/ley_adk/" class="contact" rel="noopenner noreferrer" target="_blank">Contact Me</a>
    </footer>
</body>
</html>
