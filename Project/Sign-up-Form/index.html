<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <!-- Fonts -->

    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <section class="left">
        <div class="title">
            <img src="assets/odin-lined.png" alt="odin logo" width="100px">
            <h1 class="norse">ODIN</h1>
        </div>
        <footer>
            <p>Photo by <a href="#" ref="noopener noreferrer">Halie West</a> on <a href="#" ref="noopener noreferrer">Unsplash</a></p>
        </footer>
    </section>

    <section class="right">
        <article class="guide">
            <h2>This is not a real online service! You know you need something like this in your life to help
                you realize your deepest dreams.<br>
                Sign up now to get started.
            </h2>
            <h2>You know you want to.</h2>
        </article>

        <main class="form-frame">
            <h2>Let's do this!</h2>
            <form action="" method="post">
                <div class="first-name">
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" name="first-name" id="first-name">
                </div>

                <div class="last-name">
                    <label for="last-name">LAST NAME</label>
                    <input type="text" name="last-name" id="last-name">
                </div>

                <div class="email">
                    <label for="email">EMAIL</label>
                    <input type="email" name="email" id="email">
                </div>

                <div class="phone">
                    <label for="phone">PHONE NUMBER</label>
                    <input type="tel" name="phone" id="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
                </div>

                <div class="pwd">
                    <label for="pwd">PASSWORD</label>
                    <input type="password" id="pwd" maxlength="16" minlength="8" required onblur="checkEquals()">
                    <p id="pwd-validation">* Passwords do not match</p>
                </div>

                <div class="confirm-pwd">
                    <label for="confirm-pwd">CONFIRM PASSWORD</label>
                    <input type="password" id="confirm-pwd" maxlength="16" minlength="8" onblur="checkEquals()">
                </div>
            </form>
        </main>

        <div class="create-account">
            <button type="button">Create Account</button>
            <p>Already have an account? <a href="#" class="login">Log in</a></p>
        </div>

    </section>
</body>
</html>
